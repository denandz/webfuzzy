[package]
name = "webfuzzy"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", features = ["http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
indicatif = "0.18.6"
linfa = "0.8.1"
linfa-clustering = "0.8.1"
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.10.2"
rustls = { version = "0.23.43", features = ["ring"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
